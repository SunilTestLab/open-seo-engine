[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-seo-engine"
version = "0.5.0"
description = "Dependency-free, reusable technical SEO audit engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Open SEO Engine Contributors"}]

[project.scripts]
open-seo = "open_seo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

