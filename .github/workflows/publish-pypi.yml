name: Publish to PyPI (manual, approval required)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version in pyproject.toml (e.g. 0.5.0)"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to confirm a real PyPI upload"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == os.environ['REQUESTED_VERSION'], f'Expected {version}'
          PY
      - name: Install build tooling and package
        run: python -m pip install --upgrade build twine .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Upload signed-in OIDC identity to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
