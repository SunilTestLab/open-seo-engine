[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-seo-engine"
version = "0.5.0"
description = "Dependency-free, reusable technical SEO audit engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Open SEO Engine Contributors"}]
keywords = ["seo", "technical-seo", "crawler", "site-audit", "ai-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/SunilTestLab/open-seo-engine"
Repository = "https://github.com/SunilTestLab/open-seo-engine"
Issues = "https://github.com/SunilTestLab/open-seo-engine/issues"

[project.scripts]
open-seo = "open_seo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

